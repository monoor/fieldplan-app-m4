# docker compose up -d   → http://<host>:8096
services:
  fieldplan:
    image: ghcr.io/monoor/fieldplan-app:latest
    # build: .            # or build locally instead of pulling
    container_name: fieldplan-app
    restart: unless-stopped
    ports:
      - "8096:8080"
    volumes:
      - ./data:/data
    environment:
      PUID: "1000"
      PGID: "1000"
      # PUBLIC_URL: https://plans.example.com     # set when served through a reverse proxy over HTTPS
      # TRUST_PROXY: "1"                          # number of proxies in front, when PUBLIC_URL is set
      # ANTHROPIC_API_KEY: ""                     # optional: Claude reads product pages and datasheets
      # CLAUDE_MODEL: claude-sonnet-5-5
      # CLAUDE_DAILY_LIMIT: "200"
      # IMPORT_ALLOWED_DOMAINS: ui.com,reolink.com
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
